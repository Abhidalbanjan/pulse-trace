apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pulsetrace
  labels:
    app: notification-service
    app.kubernetes.io/part-of: pulsetrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: pulse-trace-notification-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: RABBITMQ_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: pulsetrace-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            # Uncomment and populate to activate real channels:
            # - name: SLACK_WEBHOOK_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: pulsetrace-secrets
            #       key: SLACK_WEBHOOK_URL
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: pulsetrace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
