apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: pulsetrace
  labels:
    app: gateway
    app.kubernetes.io/part-of: pulsetrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: pulse-trace-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsetrace-config
                  key: LOG_SERVICE_URL
            - name: ALERT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsetrace-config
                  key: ALERT_SERVICE_URL
            - name: CORRELATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsetrace-config
                  key: CORRELATION_SERVICE_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: pulsetrace-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: pulsetrace
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# Ingress — exposes the gateway externally.
# Requires an ingress controller (e.g. nginx-ingress) in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsetrace-ingress
  namespace: pulsetrace
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: pulsetrace.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: pulsetrace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
