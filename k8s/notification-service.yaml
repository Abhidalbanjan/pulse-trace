apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pulsetrace
  labels:
    app: notification-service
    app.kubernetes.io/part-of: pulsetrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: pulse-trace-notification-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: RABBITMQ_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: pulsetrace-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            # Empty values are fine — that channel is just skipped (see
            # notification_worker.go); the always-on log channel still fires.
            # Populate k8s/secret.yaml to activate Slack/email for real.
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: SLACK_WEBHOOK_URL
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: SMTP_HOST
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: SMTP_PASSWORD
            - name: PAGERDUTY_ROUTING_KEY
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: PAGERDUTY_ROUTING_KEY
            - name: OPSGENIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: OPSGENIE_API_KEY
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: WEBHOOK_URL
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulsetrace-secrets
                  key: WEBHOOK_SECRET
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: pulsetrace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
