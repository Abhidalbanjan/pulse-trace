receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  # Trojan Horse: Accept Datadog Agent payloads directly
  datadog:
    endpoint: 0.0.0.0:8126
    
  # Trojan Horse: Accept Splunk HEC payloads directly
  splunk_hec:
    endpoint: 0.0.0.0:8088

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Add resource attributes to every span for easier filtering in Jaeger/Grafana.
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

  # Tail-based sampling policy for cost and storage optimization
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 2000
    policies:
      - name: error-policy
        type: status_code
        status_code: { status_codes: [ ERROR ] }
      - name: latency-policy
        type: latency
        latency: { threshold_ms: 500 }
      - name: normal-sampling-policy
        type: probabilistic
        probabilistic: { sampling_percentage: 1.0 }

exporters:
  # Send traces to Jaeger via OTLP gRPC.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Send traces to ClickHouse for analytics
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=true
    database: pulsetrace
    username: pulsetrace
    password: pulsetrace_secret
    ttl_days: 7
    traces_table_name: otel_traces
    create_schema: true

  # Send traces to topology-service via OTLP HTTP JSON
  otlphttp/topology:
    endpoint: http://topology-service:8084
    encoding: json

  # Expose Prometheus metrics scraped from the collector itself.
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Debug logging — remove or set verbosity: basic in production.
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp, datadog, splunk_hec]
      processors: [resource, tail_sampling, batch]
      exporters: [otlp/jaeger, clickhouse, otlphttp/topology]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
