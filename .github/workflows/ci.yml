name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each Go service is built/vetted/tested as its own isolated module (GOWORK=off),
# the same way its Dockerfile builds it — not through the repo-root go.work
# workspace. This keeps CI honest about what actually ships, and avoids
# workspace-vs-vendor conflicts (gateway-service builds with -mod=vendor from
# its own gitignored vendor/ directory; every other service resolves modules
# normally). shared/ is included because it has its own go.mod and tests.
jobs:
  go-services:
    name: go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - action-service
          - alert-service
          - correlation-service
          - gateway-service
          - log-service
          - notification-service
          - shared
          - topology-service
    env:
      GOWORK: "off"
      # Ephemeral Postgres for the DB-backed tests (schema-migration runner and
      # the gateway from-scratch provisioning test). Tests isolate themselves in
      # throwaway schemas and skip when DATABASE_URL is unset, so services that
      # don't touch Postgres are unaffected.
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@localhost:5432/pulsetrace?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsetrace
          POSTGRES_PASSWORD: pulsetrace_secret
          POSTGRES_DB: pulsetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download

      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build ./...

      - name: Test (with coverage)
        working-directory: ${{ matrix.service }}
        run: go test ./... -race -coverprofile=coverage.out

  bus-conformance:
    name: bus conformance (kafka + in-process)
    runs-on: ubuntu-latest
    # The bus port has two implementations, and the compiler checks only the
    # shape of the interface — a transport that dropped every other record, or
    # delivered out of order, or lost trace context would satisfy it perfectly.
    # The conformance suite is what forces them to agree, and it is only doing
    # that job when it runs against *both*. Without a broker the Kafka half
    # skips, which is a green tick that proves half of what it appears to.
    #
    # The broker matches docker-compose's (cp-kafka 7.6.1) rather than a
    # lighter KRaft image: the point is exercising our client against the
    # broker we actually run.
    env:
      GOWORK: "off"
      KAFKA_CONFORMANCE: "1"
      KAFKA_BROKERS: localhost:9092
    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.1
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        options: >-
          --health-cmd "nc -z localhost 2181"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      kafka:
        image: confluentinc/cp-kafka:7.6.1
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          # The job's steps run on the host and reach the broker through the
          # mapped port, so the advertised address has to be the host's.
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: shared/go.sum

      - name: Download dependencies
        working-directory: shared
        run: go mod download

      - name: Conformance — every assertion against both transports
        working-directory: shared
        # One run, then assert the Kafka half was actually part of it. A skip is
        # the failure mode this job exists to prevent: the suite going green
        # while silently proving only one implementation, which is exactly what
        # it does on a developer machine with no broker.
        run: |
          set -o pipefail
          go test ./bus/ -run Conformance -v -timeout 15m 2>&1 | tee /tmp/conf.log
          if ! grep -q -- "--- PASS: .*/kafka" /tmp/conf.log; then
            echo "::error::No Kafka conformance subtests ran — the suite proved only the in-process side."
            exit 1
          fi
          echo "Kafka subtests that passed:"
          grep -- "--- PASS: .*/kafka" /tmp/conf.log


  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Dependency audit (F21). Criticals in production deps block the build;
      # highs are reported but not gated, because a fresh framework advisory
      # fixable only by a major bump must not wedge every PR (patchable
      # transitives are pinned via package.json "overrides").
      - name: Audit production dependencies (critical blocks)
        run: npm audit --omit=dev --audit-level=critical

      - name: Report high+ advisories (non-blocking)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true

  security:
    name: security / govulncheck / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - action-service
          - alert-service
          - correlation-service
          - gateway-service
          - log-service
          - notification-service
          - shared
          - topology-service
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      # govulncheck reports only vulnerabilities the code actually reaches, so a
      # failure here is a real, call-path-verified CVE — not dependency-graph
      # noise. Gated at zero across every Go module (F21).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: govulncheck ./...

  parity:
    name: backend↔frontend parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Static analysis only (no deps, no stack): fails if a backend route has no
      # UI and isn't registered as no-UI-by-design or a known orphan, if a fixed
      # orphan is still listed, or if the frontend calls a non-existent route.
      # See scripts/parity/ and ROAD_TO_100.md · F0.1.
      - name: Enforce backend↔frontend parity
        run: node scripts/parity/check-parity.mjs

  bench-harness:
    name: benchmark harness
    runs-on: ubuntu-latest
    # The harness produces the storage and latency numbers in BENCHMARK.md that
    # the competitive plan allocates engineering weeks against. It had shipped
    # three defects that were invisible in its own output — a volume enumerator
    # that counted OpenObserve's disk in full and skipped 4.86 GiB of ours, a
    # container filter that swept in an orphan, and a size parser that returned
    # zero unconditionally. None of its tests ran anywhere. They do now.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      # Report rendering: percentile selection, unsupported-class handling, and
      # the "publish losses as loudly as wins" formatting rules.
      - name: Report renderer tests
        run: node --test scripts/bench/report.test.mjs
      # Footprint sampling. Driven by a stub docker, so it needs no daemon and
      # catches the selection and parsing bugs that a live run would take a
      # 40-minute ingest to reveal.
      - name: Footprint sampler tests
        run: ./scripts/bench/footprint.test.sh
      # Corpus reproducibility: the same seed must yield the same SHA-256, or no
      # two runs are comparable.
      - name: Corpus generator tests
        run: cd scripts/bench/corpus && GOWORK=off go test ./...

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # The full-stack end-to-end suite: brings up the real backend via
    # docker-compose, runs the Next.js frontend against it, seeds demo data, and
    # drives every page/flow with Playwright — the check that catches
    # frontend<->backend contract drift (response shapes, proxy paths, auth) that
    # neither the Go unit tests nor the frontend build can see. Previously this
    # existed only as scripts/run-e2e.sh and ran on developer machines, so those
    # regressions could merge unnoticed.
    env:
      # Pin a fixed secret so tokens minted during the run stay valid across it,
      # instead of gateway-service's random per-process fallback.
      JWT_SECRET: ci-e2e-fixed-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend stack (docker compose)
        run: docker compose up -d --build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo "started frontend (pid $!)"

      - name: Run e2e suite (waits for health, seeds, then Playwright)
        run: scripts/run-e2e.sh

      - name: Cross-tenant isolation test (multi-tenant data boundary)
        run: node scripts/test-tenant-isolation.mjs

      # Without this a failing e2e run gives Playwright output and nothing else —
      # no way to see that (for example) quickwit-setup could not attach its
      # Kafka source, or which service was unhealthy. That blind spot cost
      # several round-trips; the logs are worth the few seconds.
      - name: Dump container logs (on failure)
        if: failure()
        run: |
          echo '── service states ──'
          docker compose ps
          echo '── setup containers ──'
          docker compose logs kafka-setup quickwit-setup --no-color || true
          echo '── application services (tail) ──'
          docker compose logs --tail=120 --no-color gateway log-service correlation-service vector quickwit || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/tests/e2e/results.json
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  load-test:
    name: load test (k6 ingestion)
    runs-on: ubuntu-latest
    # Drives the telemetry ingestion hot path (gateway → log-service → Kafka →
    # ClickHouse) at a sustained arrival rate and fails the build if p95/p99
    # latency or error rate regress past the thresholds baked into the k6 script.
    # This is the check for the thing most likely to fall over first under real
    # customer traffic, which neither unit tests nor the e2e flow exercise.
    env:
      JWT_SECRET: ci-load-fixed-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for the gateway to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "gateway healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy in time"; exit 1

      - name: Run k6 ingestion load test
        # Fast per-PR regression gate: the native log path only (PROTOCOLS=logs),
        # under the limiter. The deeper multi-protocol baseline runs on a schedule
        # (.github/workflows/scale-baseline.yml). Reuse the k6 Docker image (docker
        # is already present for compose) with host networking so it reaches the
        # compose-published gateway on :8080. A writable /out mount captures the
        # per-run summary so p50/p95/p99 are recorded on every PR, not only on the
        # scheduled deep run (the script mount stays read-only).
        run: |
          mkdir -p "$RUNNER_TEMP/load-out"
          docker run --rm --network host \
            -e RATE=80 -e DURATION=30s -e PROTOCOLS=logs -e SUMMARY_OUT=/out/summary.json \
            -v "$PWD/scripts/load:/scripts:ro" \
            -v "$RUNNER_TEMP/load-out:/out" \
            grafana/k6 run /scripts/ingest-load.js

      - name: Upload load-test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: ${{ runner.temp }}/load-out/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  helm:
    name: helm chart (lint + template)
    runs-on: ubuntu-latest
    # Validates the chart renders for both deployment shapes on every change, so
    # a templating mistake can't reach a cluster. Doesn't need the app stack.
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint (default + enterprise values)
        run: |
          helm lint helm/pulsetrace
          helm lint helm/pulsetrace -f helm/pulsetrace/values-enterprise.yaml

      - name: Template renders cleanly (both value sets)
        run: |
          helm template pulsetrace helm/pulsetrace -n pulsetrace >/dev/null
          helm template pulsetrace helm/pulsetrace -n pulsetrace \
            -f helm/pulsetrace/values-enterprise.yaml >/dev/null

  docker-build:
    name: docker build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [go-services]
    # Push to GHCR only on a merge to main; PRs just build to prove the image
    # compiles. GITHUB_TOKEN needs package write for the push.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # image = the Helm chart's per-service image name (values.yaml), so a pushed
      # tag is exactly what deploy-staging pulls.
      matrix:
        include:
          - { service: action-service,       image: pulse-trace-action-service }
          - { service: alert-service,        image: pulse-trace-alert-service }
          - { service: correlation-service,  image: pulse-trace-correlation-service }
          - { service: gateway-service,      image: pulse-trace-gateway }
          - { service: log-service,          image: pulse-trace-log-service }
          - { service: notification-service, image: pulse-trace-notification-service }
          - { service: topology-service,     image: pulse-trace-topology-service }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase owner (GHCR requires it)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image }}:latest

  deploy-staging:
    name: deploy to staging
    runs-on: ubuntu-latest
    needs: [go-services, frontend, parity, e2e, security, docker-build]
    # Only on a merge to main, and only when a staging cluster is configured. The
    # `staging` environment lets an operator add required reviewers / protection.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # No STAGING_KUBECONFIG → skip cleanly rather than fail, so the pipeline is
      # green on repos/forks without a cluster while remaining ready to deploy.
      - name: Check for a staging kubeconfig
        id: guard
        run: |
          if [ -n "${{ secrets.STAGING_KUBECONFIG }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No STAGING_KUBECONFIG secret set — skipping staging deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v4
        if: steps.guard.outputs.deploy == 'true'

      - name: Configure kubeconfig
        if: steps.guard.outputs.deploy == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Resolve lowercase owner
        if: steps.guard.outputs.deploy == 'true'
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: helm upgrade --install (staging, images pinned to this commit)
        if: steps.guard.outputs.deploy == 'true'
        run: |
          helm upgrade --install pulsetrace helm/pulsetrace \
            -n pulsetrace --create-namespace \
            --set image.registry="ghcr.io/${{ steps.owner.outputs.lc }}/" \
            --set image.tag="${{ github.sha }}" \
            --wait --timeout 5m
