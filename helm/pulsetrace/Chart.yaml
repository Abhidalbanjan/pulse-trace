apiVersion: v2
name: pulsetrace
description: >-
  PulseTrace observability platform — the application microservices (gateway,
  log, alert, correlation, topology, action, notification). Data stores
  (PostgreSQL, ClickHouse, Neo4j, Kafka, Redis, RabbitMQ) are NOT part of this
  chart: point the chart at managed services (SaaS) or the customer's own
  operators (enterprise) via values + the referenced Secret.
type: application
