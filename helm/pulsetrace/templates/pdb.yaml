{{- range $name, $svc := .Values.services }}
{{- if and $svc.pdb $svc.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-pdb
  labels:
    app: {{ $name }}
    {{- include "pulsetrace.labels" $ | nindent 4 }}
spec:
  # Keep at least this many replicas through voluntary disruptions (node drains,
  # upgrades). Only enable on services that run >= 2 replicas — a minAvailable
  # PDB on a singleton would block drains entirely.
  minAvailable: {{ $svc.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
