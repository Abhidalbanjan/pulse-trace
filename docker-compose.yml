services:

  # ── Zookeeper ────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pulsetrace-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pulsetrace-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 45s

  # ── Neo4j ────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.19.0
    container_name: pulsetrace-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/pulsetrace_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsetrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsetrace
      POSTGRES_PASSWORD: pulsetrace_secret
      POSTGRES_DB: pulsetrace
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./log-service/migrations/001_create_log_entries.sql:/docker-entrypoint-initdb.d/001_create_log_entries.sql
      - ./alert-service/migrations/001_create_alerts.sql:/docker-entrypoint-initdb.d/002_create_alerts.sql
      - ./correlation-service/migrations/001_create_incidents.sql:/docker-entrypoint-initdb.d/003_create_incidents.sql
      - ./correlation-service/migrations/002_add_causal_fields.sql:/docker-entrypoint-initdb.d/004_add_causal_fields.sql
      - ./gateway-service/migrations/001_create_auth_tables.sql:/docker-entrypoint-initdb.d/005_create_auth_tables.sql
      - ./correlation-service/migrations/003_create_slo_tables.sql:/docker-entrypoint-initdb.d/006_create_slo_tables.sql
      - ./correlation-service/migrations/004_add_tenant_fields.sql:/docker-entrypoint-initdb.d/007_add_tenant_fields.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pulsetrace-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pulsetrace
      RABBITMQ_DEFAULT_PASS: pulsetrace_secret
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: pulsetrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Jaeger ───────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: pulsetrace-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── OTel Collector ───────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: pulsetrace-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_healthy

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: pulsetrace-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: pulsetrace-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  # ── Log Service ──────────────────────────────────────────────────────────────
  log-service:
    build:
      context: .
      dockerfile: log-service/Dockerfile
    container_name: pulsetrace-log-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: pulsetrace
      CLICKHOUSE_PASSWORD: clickhouse_secret
      CLICKHOUSE_ADDR_ENTERPRISE: clickhouse-enterprise:9000
      CLICKHOUSE_USER_ENTERPRISE: pulsetrace_enterprise
      CLICKHOUSE_PASSWORD_ENTERPRISE: enterprise_secret
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Alert Service ─────────────────────────────────────────────────────────────
  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: pulsetrace-alert-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: alert-service
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Correlation Service ───────────────────────────────────────────────────────
  correlation-service:
    build:
      context: .
      dockerfile: correlation-service/Dockerfile
    container_name: pulsetrace-correlation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: correlation-service
      RABBITMQ_URL: amqp://pulsetrace:pulsetrace_secret@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: pulsetrace
      CLICKHOUSE_PASSWORD: clickhouse_secret
      HYBRID_MODE: "true"
      CONTROL_PLANE_URL: http://gateway:8080/api/v1/control-plane/incidents
      PORT: "8083"
      # LangChain Go Multi-LLM support config
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CAUSAL_MODEL: ${CAUSAL_MODEL:-}
      CAUSAL_DISABLED: ${CAUSAL_DISABLED:-}
      TOPOLOGY_SERVICE_URL: http://topology-service:8084
      PLAYBOOK_HMAC_SECRET: ${PLAYBOOK_HMAC_SECRET:-pulsetrace_secure_playbook_hmac_secret}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy

  # ── Topology Service ──────────────────────────────────────────────────────────
  topology-service:
    build:
      context: .
      dockerfile: topology-service/Dockerfile
    container_name: pulsetrace-topology-service
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: pulsetrace_secret
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: topology-service
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      PORT: "8084"
      REDIS_ADDR: redis:6379
      PLAYBOOK_HMAC_SECRET: ${PLAYBOOK_HMAC_SECRET:-pulsetrace_secure_playbook_hmac_secret}
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
    ports:
      - "8084:8084"
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Notification Service ──────────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: pulsetrace-notification-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://pulsetrace:pulsetrace_secret@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      # Optional: set these to activate real channels
      # SLACK_WEBHOOK_URL: https://hooks.slack.com/services/...
      # SMTP_HOST: smtp.example.com
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Gateway Service ───────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: pulsetrace-gateway
    restart: unless-stopped
    environment:
      LOG_SERVICE_URL: http://log-service:8081
      ALERT_SERVICE_URL: http://alert-service:8082
      CORRELATION_SERVICE_URL: http://correlation-service:8083
      TOPOLOGY_SERVICE_URL: http://topology-service:8084
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_COLLECTOR_HTTP_URL: http://otel-collector:4318
      PORT: "8080"
    ports:
      - "8080:8080"
      - "4317:4317"
    depends_on:
      - postgres
      - log-service
      - alert-service
      - correlation-service
      - topology-service
      - otel-collector
      - clickhouse
      - clickhouse-enterprise

  # ── ClickHouse ───────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pulsetrace-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=pulsetrace
      - CLICKHOUSE_PASSWORD=clickhouse_secret
      # AWS S3 (local MinIO emulator)
      - AWS_S3_ENDPOINT=http://minio:9000/clickhouse-cold/data/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      # Azure Blob (local Azurite emulator)
      - AZURE_STORAGE_ACCOUNT_URL=http://azure-blob:10000/devstoreaccount1
      - AZURE_CONTAINER_NAME=clickhouse-cold
      - AZURE_ACCOUNT_NAME=devstoreaccount1
      - AZURE_ACCOUNT_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - AZURE_BLOB_PATH=data/
      # Google Cloud Storage (GCP/GCS)
      - GCP_GCS_ENDPOINT=https://storage.googleapis.com/clickhouse-cold/data/
      - GCP_ACCESS_KEY_ID=gcs_access_key
      - GCP_SECRET_ACCESS_KEY=gcs_secret_key
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml
    depends_on:
      minio:
        condition: service_healthy
      azure-blob:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ClickHouse Enterprise Shard ──────────────────────────────────────────────
  clickhouse-enterprise:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pulsetrace-clickhouse-enterprise
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=pulsetrace_enterprise
      - CLICKHOUSE_PASSWORD=enterprise_secret
      # AWS S3 (local MinIO emulator)
      - AWS_S3_ENDPOINT=http://minio:9000/clickhouse-cold-enterprise/data/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      # Azure Blob (local Azurite emulator)
      - AZURE_STORAGE_ACCOUNT_URL=http://azure-blob:10000/devstoreaccount1
      - AZURE_CONTAINER_NAME=clickhouse-cold-enterprise
      - AZURE_ACCOUNT_NAME=devstoreaccount1
      - AZURE_ACCOUNT_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - AZURE_BLOB_PATH=data/
      # Google Cloud Storage (GCP/GCS)
      - GCP_GCS_ENDPOINT=https://storage.googleapis.com/clickhouse-cold-enterprise/data/
      - GCP_ACCESS_KEY_ID=gcs_access_key
      - GCP_SECRET_ACCESS_KEY=gcs_secret_key
    ports:
      - "8124:8123"
      - "9002:9000"
    volumes:
      - clickhouse_enterprise_data:/var/lib/clickhouse
      - ./clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml
    depends_on:
      minio:
        condition: service_healthy
      azure-blob:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3 Cold Tier Emulator) ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: pulsetrace-minio
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Bucket Creator ─────────────────────────────────────────────────────
  minio-mc:
    image: minio/mc:latest
    container_name: pulsetrace-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing localminio/clickhouse-cold;
      mc mb --ignore-existing localminio/clickhouse-cold-enterprise;
      exit 0;
      "

  # ── Azure Blob Storage Emulator (Azurite) ────────────────────────────────────
  azure-blob:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: pulsetrace-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  neo4j_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  clickhouse_data:
  clickhouse_enterprise_data:
  minio_data:
  azurite_data:

