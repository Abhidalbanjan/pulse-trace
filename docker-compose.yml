services:

  # ── Zookeeper (required by Kafka) ────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pulsetrace-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pulsetrace-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST is exposed to the host machine; PLAINTEXT is used inside Docker.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 45s

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsetrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsetrace
      POSTGRES_PASSWORD: pulsetrace_secret
      POSTGRES_DB: pulsetrace
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres only executes .sql files directly in initdb.d (not subdirs).
      # Both migration files are mounted at the top level.
      - ./log-service/migrations/001_create_log_entries.sql:/docker-entrypoint-initdb.d/001_create_log_entries.sql
      - ./alert-service/migrations/001_create_alerts.sql:/docker-entrypoint-initdb.d/002_create_alerts.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Log Service ─────────────────────────────────────────────────────────────
  log-service:
    build:
      context: .
      dockerfile: log-service/Dockerfile
    container_name: pulsetrace-log-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Alert Service ────────────────────────────────────────────────────────────
  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: pulsetrace-alert-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: alert-service
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Gateway Service ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: pulsetrace-gateway
    restart: unless-stopped
    environment:
      LOG_SERVICE_URL: http://log-service:8081
      ALERT_SERVICE_URL: http://alert-service:8082
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - log-service
      - alert-service

volumes:
  postgres_data:
