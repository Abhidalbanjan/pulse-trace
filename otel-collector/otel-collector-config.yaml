receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # NOTE: the "Trojan Horse" Datadog/Splunk ingestion is NOT terminated here
  # anymore. The collector's native datadog/splunk_hec receivers do no per-tenant
  # authentication and no tenant attribution, so exposing them let anyone write
  # un-tenanted telemetry straight into the shared stores. That capability now
  # lives in the gateway (gateway-service/internal/ingestproxy): it authenticates
  # the DD-API-KEY / Splunk token against a PulseTrace ingestion key, stamps the
  # resolved tenant, and forwards as OTLP to the `otlp` receiver above — so
  # migrated telemetry gets the same isolation as native OTLP. The collector must
  # only be reachable from the gateway + internal services (never published).

  # Scrape Prometheus-format /metrics endpoints and convert them to OTLP so
  # they land in the native metrics pillar (ClickHouse) alongside anything
  # pushed via the otlp receiver above. Same target list as
  # prometheus/prometheus.yml (kept in sync manually - two different tools
  # scraping the same endpoints for two different purposes: Prometheus for
  # internal self-monitoring/Grafana, this receiver for the product's own
  # metrics UI). otel-collector:8888 is the collector's own self-telemetry
  # and is always real; the per-service /metrics targets will start
  # returning data once each service registers a promhttp handler (tracked
  # separately - not yet done).
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]
        - job_name: gateway-service
          scrape_interval: 15s
          static_configs:
            - targets: ["gateway:8080"]
        - job_name: log-service
          scrape_interval: 15s
          static_configs:
            - targets: ["log-service:8081"]
        - job_name: alert-service
          scrape_interval: 15s
          static_configs:
            - targets: ["alert-service:8082"]

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Add resource attributes to every span for easier filtering in Jaeger/Grafana.
  # DEPLOYMENT_ENVIRONMENT is a real env var (set in docker-compose.yml, defaults to
  # "development"), not a hardcoded value - so environment-based retention below is meaningful.
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert

  # Tail-based sampling: retention filters. Any ONE matching policy keeps the trace,
  # regardless of the others - this is the same tag-based mechanism Datadog calls
  # "Retention Filters". manual-keep-policy is the escape hatch application code uses
  # via telemetry.ForceKeep(ctx) (shared/telemetry/sampler.go) for traces that must be
  # kept no matter what (e.g. a critical business transaction), independent of error/
  # latency/random sampling.
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 2000
    policies:
      - name: error-policy
        type: status_code
        status_code: { status_codes: [ ERROR ] }
      - name: latency-policy
        type: latency
        latency: { threshold_ms: 500 }
      - name: manual-keep-policy
        type: string_attribute
        string_attribute: { key: sampling.priority, values: [ keep ] }
      - name: normal-sampling-policy
        type: probabilistic
        probabilistic: { sampling_percentage: 1.0 }

exporters:
  # Send traces to Jaeger via OTLP gRPC.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Send traces to ClickHouse for analytics
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=true
    database: pulsetrace
    username: pulsetrace
    password: pulsetrace_secret
    ttl_days: 7
    traces_table_name: otel_traces
    # create_schema isn't a valid key on the clickhouse exporter in collector
    # v0.101.0 (it was added in a later release) - the collector was crash-looping
    # on startup ("has invalid keys: create_schema") on every boot until this was
    # removed. Schema/table creation is this exporter's default behavior pre-flag.

  # Send traces to topology-service via OTLP HTTP JSON
  otlphttp/topology:
    endpoint: http://topology-service:8084
    encoding: json

  # Send traces to Quickwit's native OTLP gRPC ingestion (auto-creates otel-traces-v0_7 index)
  otlp/quickwit:
    endpoint: quickwit:7281
    tls:
      insecure: true

  # Expose Prometheus metrics scraped from the collector itself. Kept purely
  # for PulseTrace's own internal service self-monitoring (Prometheus/Grafana
  # in docker-compose.yml) — the product's own metrics UI reads from
  # ClickHouse below instead, so this stays even though the frontend never
  # links to it.
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Send metrics to ClickHouse so they're a native, queryable pillar of the
  # product (gateway-service's MetricsHandler reads these tables) instead of
  # only being visible via a bundled Grafana dashboard. Same instance/creds
  # as the traces clickhouse exporter above; one table per OTLP metric type.
  clickhouse/metrics:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=true
    database: pulsetrace
    username: pulsetrace
    password: pulsetrace_secret
    ttl_days: 30
    # NOTE: the per-type `metrics_tables` map is not a valid key on the clickhouse
    # exporter in collector v0.101.0 (it was added in a later release), and it was
    # crash-looping the collector on every boot ("has invalid keys: metrics_tables")
    # — which took down the whole telemetry backend. Removed: this exporter already
    # auto-creates the default otel_metrics_gauge / otel_metrics_sum / … tables
    # (the exact names gateway-service's MetricsHandler queries) without it.

  # Debug logging — remove or set verbosity: basic in production.
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      # Datadog/Splunk migration traces arrive here as OTLP too — the gateway's
      # ingestproxy authenticates, tenant-stamps, and forwards them to the `otlp`
      # receiver, so there's a single tenant-attributed entry point.
      receivers: [otlp]
      processors: [resource, tail_sampling, batch]
      exporters: [otlp/jaeger, clickhouse, otlphttp/topology, otlp/quickwit]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus, clickhouse/metrics]

    # Logs pipeline: persists OTLP logs to ClickHouse otel_logs. Without it the
    # collector silently drops OTLP logs. The product's log explorer reads Quickwit
    # (pulsetrace-logs), and the gateway now publishes ALL log sources there as
    # native LogEntry records — app logs (Vector→log-service), Datadog/Splunk
    # migration logs, and OTLP-native logs (gRPC + HTTP) via the logbridge — so the
    # explorer shows everything. This pipeline is therefore only the gateway's
    # fallback sink for when Kafka is unreachable at startup (logs then land here in
    # ClickHouse instead of Quickwit); nothing queries otel_logs in the happy path.
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [clickhouse]
