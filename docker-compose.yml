services:

  # ── Zookeeper ────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pulsetrace-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pulsetrace-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 45s

  # ── Neo4j ────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.19.0
    container_name: pulsetrace-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/pulsetrace_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── ClickHouse (High-Performance Trace Analytics) ───────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pulsetrace-clickhouse
    restart: unless-stopped
    depends_on:
      minio-mc:
        condition: service_completed_successfully
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: pulsetrace
      CLICKHOUSE_USER: pulsetrace
      CLICKHOUSE_PASSWORD: pulsetrace_secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsetrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsetrace
      POSTGRES_PASSWORD: pulsetrace_secret
      POSTGRES_DB: pulsetrace
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./log-service/migrations/001_create_log_entries.sql:/docker-entrypoint-initdb.d/001_create_log_entries.sql
      - ./alert-service/migrations/001_create_alerts.sql:/docker-entrypoint-initdb.d/002_create_alerts.sql
      - ./correlation-service/migrations/001_create_incidents.sql:/docker-entrypoint-initdb.d/003_create_incidents.sql
      - ./correlation-service/migrations/002_add_causal_fields.sql:/docker-entrypoint-initdb.d/004_add_causal_fields.sql
      - ./gateway-service/migrations/001_create_auth_tables.sql:/docker-entrypoint-initdb.d/005_create_auth_tables.sql
      - ./correlation-service/migrations/003_create_slo_tables.sql:/docker-entrypoint-initdb.d/006_create_slo_tables.sql
      - ./correlation-service/migrations/004_add_tenant_fields.sql:/docker-entrypoint-initdb.d/007_add_tenant_fields.sql
      - ./gateway-service/migrations/002_create_error_tracking.sql:/docker-entrypoint-initdb.d/008_create_error_tracking.sql
      - ./gateway-service/migrations/003_create_deployments.sql:/docker-entrypoint-initdb.d/009_create_deployments.sql
      - ./gateway-service/migrations/004_create_rbac_abac.sql:/docker-entrypoint-initdb.d/010_create_rbac_abac.sql
      - ./gateway-service/migrations/005_scope_editor_permissions.sql:/docker-entrypoint-initdb.d/011_scope_editor_permissions.sql
      - ./gateway-service/migrations/006_create_audit_log.sql:/docker-entrypoint-initdb.d/012_create_audit_log.sql
      - ./gateway-service/migrations/007_create_rate_limit_rules.sql:/docker-entrypoint-initdb.d/013_create_rate_limit_rules.sql
      - ./gateway-service/migrations/008_create_alert_rules.sql:/docker-entrypoint-initdb.d/014_create_alert_rules.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pulsetrace-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pulsetrace
      RABBITMQ_DEFAULT_PASS: pulsetrace_secret
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: pulsetrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Jaeger ───────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: pulsetrace-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── OTel Collector ───────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: pulsetrace-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "8889:8889"
      - "8126:8126" # Datadog receiver
      - "8088:8088" # Splunk HEC receiver
    depends_on:
      jaeger:
        condition: service_healthy
      quickwit:
        condition: service_healthy

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: pulsetrace-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: pulsetrace-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  # ── Log Service ──────────────────────────────────────────────────────────────
  log-service:
    build:
      context: .
      dockerfile: log-service/Dockerfile
    container_name: pulsetrace-log-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      QUICKWIT_URL: http://quickwit:7280
      TOPOLOGY_SERVICE_URL: http://topology-service:8084
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Alert Service ─────────────────────────────────────────────────────────────
  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: pulsetrace-alert-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: alert-service
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      TOPOLOGY_SERVICE_URL: http://topology-service:8084
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Correlation Service ───────────────────────────────────────────────────────
  correlation-service:
    build:
      context: .
      dockerfile: correlation-service/Dockerfile
    container_name: pulsetrace-correlation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: correlation-service
      RABBITMQ_URL: amqp://pulsetrace:pulsetrace_secret@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      QUICKWIT_URL: http://quickwit:7280
      HYBRID_MODE: "true"
      CONTROL_PLANE_URL: http://gateway:8080/api/v1/control-plane/incidents
      # Lets the chat handler's natural-language query experience run real
      # search_logs/search_traces/query_metric tool calls against
      # gateway-service's own endpoints (auth-scoped by the asking user's
      # forwarded bearer token) instead of the LLM inventing numbers.
      GATEWAY_URL: http://gateway:8080
      PORT: "8083"
      # Used by the anomaly detector to poll real per-service RED metrics directly
      # from ClickHouse (queried directly rather than via gateway's authenticated
      # /api/v1/services route — see anomaly_detector.go for why).
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulsetrace}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulsetrace_secret}
      # LangChain Go Multi-LLM support config.
      # LLM_PROVIDERS is an ordered failover chain ("anthropic:model,openai,ollama")
      # used by both the causal analyzer and the chat/SLO handlers; LLM_PROVIDER
      # and LLM_MODEL remain as the legacy single-provider form. See .env.example.
      LLM_PROVIDERS: ${LLM_PROVIDERS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CAUSAL_MODEL: ${CAUSAL_MODEL:-}
      CAUSAL_DISABLED: ${CAUSAL_DISABLED:-}
      TOPOLOGY_SERVICE_URL: http://topology-service:8084
      # DEV DEFAULT ONLY — same fallback value on both correlation-service and
      # topology-service so they interoperate out of the box locally. Override
      # PLAYBOOK_HMAC_SECRET in any shared/staging/production deployment; see .env.example.
      PLAYBOOK_HMAC_SECRET: ${PLAYBOOK_HMAC_SECRET:-pulsetrace_secure_playbook_hmac_secret}
      # Self-healing posture. The local demo stack defaults to "auto" so
      # demo_incident.sh still shows remediation end-to-end; the code default
      # (used by any deployment that doesn't set this) is "manual". See .env.example.
      REMEDIATION_MODE: ${REMEDIATION_MODE:-auto}
      REMEDIATION_CONFIDENCE_THRESHOLD: ${REMEDIATION_CONFIDENCE_THRESHOLD:-}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ── Topology Service ──────────────────────────────────────────────────────────
  topology-service:
    build:
      context: .
      dockerfile: topology-service/Dockerfile
    container_name: pulsetrace-topology-service
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: pulsetrace_secret
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: topology-service
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      PORT: "8084"
      REDIS_ADDR: redis:6379
      # DEV DEFAULT ONLY — same fallback value on both correlation-service and
      # topology-service so they interoperate out of the box locally. Override
      # PLAYBOOK_HMAC_SECRET in any shared/staging/production deployment; see .env.example.
      PLAYBOOK_HMAC_SECRET: ${PLAYBOOK_HMAC_SECRET:-pulsetrace_secure_playbook_hmac_secret}
      # Self-healing posture. The local demo stack defaults to "auto" so
      # demo_incident.sh still shows remediation end-to-end; the code default
      # (used by any deployment that doesn't set this) is "manual". See .env.example.
      REMEDIATION_MODE: ${REMEDIATION_MODE:-auto}
      REMEDIATION_CONFIDENCE_THRESHOLD: ${REMEDIATION_CONFIDENCE_THRESHOLD:-}
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
    ports:
      - "8084:8084"
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Notification Service ──────────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: pulsetrace-notification-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://pulsetrace:pulsetrace_secret@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      TOPOLOGY_SERVICE_URL: http://topology-service:8084
      # Optional: set these in your .env to activate real delivery channels.
      # Unset = that channel is skipped (log channel always fires regardless).
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@pulsetrace.local}
      SMTP_TO: ${SMTP_TO:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Vector Agent (Edge Batching) ─────────────────────────────────────────────
  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: pulsetrace-vector
    restart: unless-stopped
    # The image's default entrypoint loads /etc/vector/vector.yaml regardless of
    # what's bind-mounted at vector.toml, silently falling back to its own baked-in
    # demo config (a demo_logs source generating fake syslog messages) instead of
    # our http_server source. Force it to load our config explicitly.
    command: ["--config", "/etc/vector/vector.toml"]
    ports:
      - "8383:8383"
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml
    depends_on:
      - gateway

  # ── Gateway Service ───────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: pulsetrace-gateway
    restart: unless-stopped
    environment:
      LOG_SERVICE_URL: http://log-service:8081
      ALERT_SERVICE_URL: http://alert-service:8082
      CORRELATION_SERVICE_URL: http://correlation-service:8083
      TOPOLOGY_SERVICE_URL: http://topology-service:8084
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      OTEL_COLLECTOR_HTTP_URL: http://otel-collector:4318
      REDIS_ADDR: redis:6379
      PORT: "8080"
      CLICKHOUSE_URL: http://clickhouse:8123
      # Must match the clickhouse container's own CLICKHOUSE_USER/CLICKHOUSE_PASSWORD above.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulsetrace}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulsetrace_secret}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8080:8080"
      - "4317:4317"
    depends_on:
      - postgres
      - log-service
      - alert-service
      - correlation-service
      - topology-service
      - otel-collector
      - redis

  # ── Action Service (Auto-Remediation Engine) ────────────────────────────────────
  # Previously built but never wired into docker-compose, so RESTART_PODS/SCALE/
  # ROLLBACK (see action-service/internal/k8s/operator.go) had no reachable
  # instance in local dev. Runs in MOCK mode automatically if no ~/.kube/config
  # or in-cluster credentials are present — safe to run without a real cluster.
  action-service:
    build:
      context: .
      dockerfile: action-service/Dockerfile
    container_name: pulsetrace-action-service
    restart: unless-stopped
    environment:
      # Enforced independently of the control plane: this is the process that
      # actually mutates the cluster, so it gets its own veto. See .env.example.
      REMEDIATION_MODE: ${REMEDIATION_MODE:-auto}
      K8S_TARGET_NAMESPACE: ${K8S_TARGET_NAMESPACE:-}
    ports:
      - "8085:8085"
    volumes:
      # Mount the host kubeconfig read-only so the operator can act on a real
      # cluster if one is configured; harmless (falls back to MOCK mode) if not.
      - ${HOME}/.kube:/root/.kube:ro

  # ── MinIO (S3 Cold Tier Emulator) ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: pulsetrace-minio
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Bucket Creator ─────────────────────────────────────────────────────
  minio-mc:
    image: minio/mc:latest
    container_name: pulsetrace-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing localminio/quickwit-indexes;
      mc mb --ignore-existing localminio/clickhouse-cold;
      exit 0;
      "

  # ── Azure Blob Storage Emulator (Azurite) ────────────────────────────────────
  azure-blob:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: pulsetrace-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    volumes:
      - azurite_data:/data

  # ── Quickwit (S3-Native Log & Trace Indexing) ───────────────────────────────
  quickwit:
    image: quickwit/quickwit:0.8.1
    container_name: pulsetrace-quickwit
    restart: unless-stopped
    command: run
    environment:
      QW_METASTORE_URI: s3://quickwit-indexes/metastore
      QW_DEFAULT_INDEX_ROOT_URI: s3://quickwit-indexes/indexes
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://minio:9000
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1
      QW_S3_ENDPOINT: http://minio:9000
      # Required for MinIO (path-style access)
      QW_S3_FORCE_PATH_STYLE_ACCESS: "true"
    ports:
      - "7280:7280"   # REST API
      - "7281:7281"   # gRPC
    volumes:
      - quickwit_data:/quickwit/qwdata
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7280/health/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Quickwit Index & Source Bootstrap ────────────────────────────────────────
  quickwit-setup:
    image: quickwit/quickwit:0.8.1
    container_name: pulsetrace-quickwit-setup
    environment:
      QW_CLUSTER_ENDPOINT: http://quickwit:7280
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      QW_S3_FORCE_PATH_STYLE_ACCESS: "true"
    volumes:
      - ./quickwit:/config
    depends_on:
      quickwit:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Creating Quickwit indexes...';
      quickwit index create --index-config /config/logs-index.yaml --endpoint http://quickwit:7280 || true;
      echo 'Attaching Kafka source for logs...';
      quickwit source create --index pulsetrace-logs --source-config /config/kafka-source.yaml --endpoint http://quickwit:7280 || true;
      echo 'Quickwit setup complete. Traces use native OTLP ingestion (otel-traces-v0_7 index, auto-created by the collector).';
      "

  # ── Pyroscope (Continuous Profiling) ─────────────────────────────────────────
  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pulsetrace-pyroscope
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      PYROSCOPE_LOG_LEVEL: info
    volumes:
      - pyroscope_data:/var/lib/pyroscope

volumes:
  postgres_data:
  neo4j_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  quickwit_data:
  minio_data:
  azurite_data:
  pyroscope_data:

