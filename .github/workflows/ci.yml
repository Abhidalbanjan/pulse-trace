name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each Go service is built/vetted/tested as its own isolated module (GOWORK=off),
# the same way its Dockerfile builds it — not through the repo-root go.work
# workspace. This keeps CI honest about what actually ships, and avoids
# workspace-vs-vendor conflicts (gateway-service builds with -mod=vendor from
# its own gitignored vendor/ directory; every other service resolves modules
# normally). shared/ is included because it has its own go.mod and tests.
jobs:
  go-services:
    name: go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - action-service
          - alert-service
          - correlation-service
          - gateway-service
          - log-service
          - notification-service
          - shared
          - topology-service
    env:
      GOWORK: "off"
      # Ephemeral Postgres for the DB-backed tests (schema-migration runner and
      # the gateway from-scratch provisioning test). Tests isolate themselves in
      # throwaway schemas and skip when DATABASE_URL is unset, so services that
      # don't touch Postgres are unaffected.
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@localhost:5432/pulsetrace?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsetrace
          POSTGRES_PASSWORD: pulsetrace_secret
          POSTGRES_DB: pulsetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download

      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build ./...

      - name: Test (with coverage)
        working-directory: ${{ matrix.service }}
        run: go test ./... -race -coverprofile=coverage.out

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # The full-stack end-to-end suite: brings up the real backend via
    # docker-compose, runs the Next.js frontend against it, seeds demo data, and
    # drives every page/flow with Playwright — the check that catches
    # frontend<->backend contract drift (response shapes, proxy paths, auth) that
    # neither the Go unit tests nor the frontend build can see. Previously this
    # existed only as scripts/run-e2e.sh and ran on developer machines, so those
    # regressions could merge unnoticed.
    env:
      # Pin a fixed secret so tokens minted during the run stay valid across it,
      # instead of gateway-service's random per-process fallback.
      JWT_SECRET: ci-e2e-fixed-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend stack (docker compose)
        run: docker compose up -d --build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo "started frontend (pid $!)"

      - name: Run e2e suite (waits for health, seeds, then Playwright)
        run: scripts/run-e2e.sh

      - name: Cross-tenant isolation test (multi-tenant data boundary)
        run: node scripts/test-tenant-isolation.mjs

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/tests/e2e/results.json
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    name: docker build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [go-services]
    strategy:
      fail-fast: false
      matrix:
        service:
          - action-service
          - alert-service
          - correlation-service
          - gateway-service
          - log-service
          - notification-service
          - topology-service
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t pulsetrace/${{ matrix.service }}:ci .
