apiVersion: v1
kind: Secret
metadata:
  name: pulsetrace-secrets
  namespace: pulsetrace
type: Opaque
# Values are base64-encoded. In production use Sealed Secrets or Vault.
# echo -n 'value' | base64
stringData:
  POSTGRES_PASSWORD: "pulsetrace_secret"
  DATABASE_URL: "postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable"
  RABBITMQ_URL: "amqp://pulsetrace:pulsetrace_secret@rabbitmq:5672/"
  # Causal AI — set to an Anthropic API key to enable LLM-backed root-cause analysis.
  # Leave empty to fall back to the deterministic rule-based analyzer.
  ANTHROPIC_API_KEY: ""
  # REQUIRED — do not leave unset in any real deployment. gateway-service
  # generates a random per-process secret with a loud warning if this is
  # empty, which is fine for a scratch demo but invalidates every session
  # on every pod restart, which real users will notice.
  JWT_SECRET: "CHANGE_ME_generate_a_real_random_secret"
  CLICKHOUSE_PASSWORD: "pulsetrace_secret"
  NEO4J_PASSWORD: "pulsetrace_secret"
  # Shared HMAC secret between correlation-service and topology-service for
  # authenticating automated playbook execution requests — must be identical
  # on both. Change together, not independently.
  PLAYBOOK_HMAC_SECRET: "pulsetrace_secure_playbook_hmac_secret"
  # Optional notification channels — leave blank to skip that channel
  # (the always-on log channel fires regardless; see notification_worker.go).
  SLACK_WEBHOOK_URL: ""
  SMTP_HOST: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
