global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the OTel Collector's Prometheus exporter.
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape each service's /metrics endpoint (if you add a Prometheus exporter later).
  - job_name: "log-service"
    static_configs:
      - targets: ["log-service:8081"]
    metrics_path: /metrics

  - job_name: "alert-service"
    static_configs:
      - targets: ["alert-service:8082"]
    metrics_path: /metrics

  - job_name: "gateway-service"
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics
