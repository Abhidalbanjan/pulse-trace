version: 0.8
index_id: pulsetrace-logs
doc_mapping:
  mode: dynamic
  field_mappings:
    - name: timestamp
      type: datetime
      fast: true
    - name: service_name
      type: text
      tokenizer: raw
      fast: true
    - name: level
      type: text
      tokenizer: raw
      fast: true
    - name: message
      type: text
      tokenizer: default
      # Phrase queries need token positions. Quickwit defaults `record` to
      # `basic`, which stores no positions, so log-service's phrase clause
      # (`message:"connection pool"`, built by buildLogQuery) silently matched
      # nothing: single words worked, any multi-word search returned zero hits.
      # That is the worst possible failure mode for log search during an
      # incident — an empty result set reads as "no such logs", not "your query
      # could never match".
      #
      # Costs somewhat more index space. Existing indexes must be recreated to
      # pick this up; splits written under `basic` keep the old behaviour.
      record: position
    - name: trace_id
      type: text
      tokenizer: raw
      fast: true
    - name: tenant_id
      type: text
      tokenizer: raw
      fast: true
  timestamp_field: timestamp
