services:

  # ── Zookeeper (required by Kafka) ────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pulsetrace-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pulsetrace-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/9092' 2>/dev/null"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 45s

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsetrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsetrace
      POSTGRES_PASSWORD: pulsetrace_secret
      POSTGRES_DB: pulsetrace
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres only executes .sql files directly in initdb.d (not subdirs).
      - ./log-service/migrations/001_create_log_entries.sql:/docker-entrypoint-initdb.d/001_create_log_entries.sql
      - ./alert-service/migrations/001_create_alerts.sql:/docker-entrypoint-initdb.d/002_create_alerts.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Jaeger (all-in-one) ──────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: pulsetrace-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # gRPC (used by OTel Collector → Jaeger)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── OpenTelemetry Collector ──────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: pulsetrace-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC (services → collector)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    depends_on:
      jaeger:
        condition: service_healthy

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: pulsetrace-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: pulsetrace-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  # ── Log Service ─────────────────────────────────────────────────────────────
  log-service:
    build:
      context: .
      dockerfile: log-service/Dockerfile
    container_name: pulsetrace-log-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Alert Service ────────────────────────────────────────────────────────────
  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: pulsetrace-alert-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@postgres:5432/pulsetrace?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: alert-service
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ── Gateway Service ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: pulsetrace-gateway
    restart: unless-stopped
    environment:
      LOG_SERVICE_URL: http://log-service:8081
      ALERT_SERVICE_URL: http://alert-service:8082
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - log-service
      - alert-service
      - otel-collector

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
