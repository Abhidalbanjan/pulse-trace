version: 0.8
source_id: kafka-logs-source
source_type: kafka
params:
  topic: logs
  # Quickwit 0.8's Kafka source only recognizes topic/client_log_level/client_params/
  # enable_backfill_mode at the top level - bootstrap_servers/client_id/enable.auto.commit
  # aren't real fields there. Native librdkafka settings (including the required
  # bootstrap.servers) go under client_params instead.
  client_params:
    bootstrap.servers: kafka:29092
    client.id: quickwit-consumer
    enable.auto.commit: true
    # Defensive: librdkafka defaults to `latest`, so a source created after
    # messages were already produced would silently skip everything published
    # before it existed. `earliest` means a late or re-created source still
    # indexes the backlog instead of starting blind.
    auto.offset.reset: earliest
transform:
  # Use Vector Remap Language (VRL) to parse both JSON and unstructured Syslog via Grok.
  # Quickwit 0.8's source transform schema names this field `script`, not `vrl` -
  # the old field name silently failed source creation (masked by `|| true` in the
  # quickwit-setup init container), so log ingestion into Quickwit never worked.
  script: |
    # By default, Kafka payloads arrive in a 'message' field in Quickwit VRL.
    if starts_with(string!(.message), "{") {
      # It's JSON from our log-service.
      parsed, err = parse_json(.message)
      if err == null {
        # merge() is fallible here specifically because `parsed` is inferred as
        # possibly-non-object (any valid JSON value, not just an object).
        ., merge_err = merge(., parsed)
      }
    } else {
      # It's an unstructured syslog message, parse with grok
      # e.g., "Oct 11 22:14:15 mymachine su: 'su root' failed for lonvick on /dev/pts/8"
      grok_pattern = "%{SYSLOGTIMESTAMP:timestamp} %{SYSLOGHOST:service_name} %{DATA:level} %{GREEDYDATA:message}"
      parsed, err = parse_grok(.message, grok_pattern)
      if err == null {
        # parse_grok's result is always a known object, so merge() is infallible here.
        . = merge(., parsed)
      }
    }

    # `metadata` arrives as a JSON-encoded *string*, because LogEntry carries it
    # as one (`Metadata string`, set by log-service from the request's map).
    # Left alone it is an opaque blob: the index stores one long string, so no
    # attribute inside it is a field, and no filter or aggregation can reach any
    # of them. A user could attach customer_id to every record and never once
    # search on it.
    #
    # Parsing it here turns each attribute into a real field under `metadata.`,
    # which the index picks up through its dynamic mapping — already configured
    # `fast` with `expand_dots`, so these are aggregatable with no per-field
    # mapping and no allowlist of blessed attribute names.
    #
    # Nested rather than merged into the top level on purpose: a caller who
    # sends `{"level": "..."}` as metadata must not be able to overwrite the log
    # record's real level. Collision is impossible when the attributes live
    # under their own key.
    #
    # `is_string` guards the infallible `string!`: without it, a record whose
    # metadata is already an object would abort the whole VRL program and be
    # dropped rather than indexed. A transform that discards telemetry to tidy
    # up a field is a worse bug than the one being fixed.
    if is_string(.metadata) {
      meta, meta_err = parse_json(string!(.metadata))
      if meta_err == null && is_object(meta) {
        .metadata = object!(meta)
      }
    }

    # Ensure timestamp is a valid datetime for the timestamp_field
    if exists(.timestamp) == false {
       .timestamp = now()
    }
