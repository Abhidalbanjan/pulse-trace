name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each Go service is built/vetted/tested as its own isolated module (GOWORK=off),
# the same way its Dockerfile builds it — not through the repo-root go.work
# workspace. This keeps CI honest about what actually ships, and avoids
# workspace-vs-vendor conflicts (gateway-service builds with -mod=vendor from
# its own gitignored vendor/ directory; every other service resolves modules
# normally). shared/ is included because it has its own go.mod and tests.
jobs:
  go-services:
    name: go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - action-service
          - alert-service
          - correlation-service
          - gateway-service
          - log-service
          - notification-service
          - shared
          - topology-service
    env:
      GOWORK: "off"
      # Ephemeral Postgres for the DB-backed tests (schema-migration runner and
      # the gateway from-scratch provisioning test). Tests isolate themselves in
      # throwaway schemas and skip when DATABASE_URL is unset, so services that
      # don't touch Postgres are unaffected.
      DATABASE_URL: postgres://pulsetrace:pulsetrace_secret@localhost:5432/pulsetrace?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsetrace
          POSTGRES_PASSWORD: pulsetrace_secret
          POSTGRES_DB: pulsetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download

      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build ./...

      - name: Test (with coverage)
        working-directory: ${{ matrix.service }}
        run: go test ./... -race -coverprofile=coverage.out

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  parity:
    name: backend↔frontend parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Static analysis only (no deps, no stack): fails if a backend route has no
      # UI and isn't registered as no-UI-by-design or a known orphan, if a fixed
      # orphan is still listed, or if the frontend calls a non-existent route.
      # See scripts/parity/ and ROAD_TO_100.md · F0.1.
      - name: Enforce backend↔frontend parity
        run: node scripts/parity/check-parity.mjs

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # The full-stack end-to-end suite: brings up the real backend via
    # docker-compose, runs the Next.js frontend against it, seeds demo data, and
    # drives every page/flow with Playwright — the check that catches
    # frontend<->backend contract drift (response shapes, proxy paths, auth) that
    # neither the Go unit tests nor the frontend build can see. Previously this
    # existed only as scripts/run-e2e.sh and ran on developer machines, so those
    # regressions could merge unnoticed.
    env:
      # Pin a fixed secret so tokens minted during the run stay valid across it,
      # instead of gateway-service's random per-process fallback.
      JWT_SECRET: ci-e2e-fixed-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend stack (docker compose)
        run: docker compose up -d --build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo "started frontend (pid $!)"

      - name: Run e2e suite (waits for health, seeds, then Playwright)
        run: scripts/run-e2e.sh

      - name: Cross-tenant isolation test (multi-tenant data boundary)
        run: node scripts/test-tenant-isolation.mjs

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/tests/e2e/results.json
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  load-test:
    name: load test (k6 ingestion)
    runs-on: ubuntu-latest
    # Drives the telemetry ingestion hot path (gateway → log-service → Kafka →
    # ClickHouse) at a sustained arrival rate and fails the build if p95/p99
    # latency or error rate regress past the thresholds baked into the k6 script.
    # This is the check for the thing most likely to fall over first under real
    # customer traffic, which neither unit tests nor the e2e flow exercise.
    env:
      JWT_SECRET: ci-load-fixed-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for the gateway to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "gateway healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy in time"; exit 1

      - name: Run k6 ingestion load test
        # Reuse the k6 Docker image (docker is already present for compose) with
        # host networking so it reaches the compose-published gateway on :8080.
        run: |
          docker run --rm --network host \
            -e RATE=80 -e DURATION=30s \
            -v "$PWD/scripts/load:/scripts:ro" \
            grafana/k6 run /scripts/ingest-load.js

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose down -v

  helm:
    name: helm chart (lint + template)
    runs-on: ubuntu-latest
    # Validates the chart renders for both deployment shapes on every change, so
    # a templating mistake can't reach a cluster. Doesn't need the app stack.
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint (default + enterprise values)
        run: |
          helm lint helm/pulsetrace
          helm lint helm/pulsetrace -f helm/pulsetrace/values-enterprise.yaml

      - name: Template renders cleanly (both value sets)
        run: |
          helm template pulsetrace helm/pulsetrace -n pulsetrace >/dev/null
          helm template pulsetrace helm/pulsetrace -n pulsetrace \
            -f helm/pulsetrace/values-enterprise.yaml >/dev/null

  docker-build:
    name: docker build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [go-services]
    strategy:
      fail-fast: false
      matrix:
        service:
          - action-service
          - alert-service
          - correlation-service
          - gateway-service
          - log-service
          - notification-service
          - topology-service
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t pulsetrace/${{ matrix.service }}:ci .
