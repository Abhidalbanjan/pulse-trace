apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsetrace-config
  namespace: pulsetrace
data:
  # Kafka
  KAFKA_BROKERS: "kafka:29092"
  # PostgreSQL (non-secret parts)
  POSTGRES_DB: "pulsetrace"
  POSTGRES_USER: "pulsetrace"
  # OTel
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  # Service ports
  LOG_SERVICE_PORT: "8081"
  ALERT_SERVICE_PORT: "8082"
  CORRELATION_SERVICE_PORT: "8083"
  # Service URLs (used by gateway)
  LOG_SERVICE_URL: "http://log-service:8081"
  ALERT_SERVICE_URL: "http://alert-service:8082"
  CORRELATION_SERVICE_URL: "http://correlation-service:8083"
  TOPOLOGY_SERVICE_URL: "http://topology-service:8084"
  ACTION_SERVICE_URL: "http://action-service:8085"
  # Used by correlation-service's chat handler to run real search_logs/
  # search_traces/query_metric tool calls (natural-language query experience)
  # against gateway-service's own endpoints instead of the LLM inventing data.
  GATEWAY_URL: "http://gateway:8080"
  # ClickHouse (non-secret parts) — used by gateway and correlation-service
  # (anomaly detector queries it directly; see anomaly_detector.go)
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USER: "pulsetrace"
  # Neo4j / Redis (topology-service)
  NEO4J_URI: "bolt://neo4j:7687"
  REDIS_ADDR: "redis:6379"
  # Causal AI defaults — see k8s/secret.yaml for ANTHROPIC_API_KEY.
  CAUSAL_MODEL: "claude-opus-4-7"
  # action-service remediates deployments in THIS namespace, not its own —
  # point it at wherever your monitored services actually run.
  K8S_TARGET_NAMESPACE: "pulsetrace"
